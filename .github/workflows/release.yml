name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  # actions: write + id-token: write added after v0.2.8 release
  # failed with "Resource not accessible by integration" on the
  # POST /releases call across all three runners, despite contents:
  # write being granted (token header confirmed `Contents: write`).
  # No YAML or tauri-action change between v0.2.7 success and v0.2.8
  # failure — widening the scope is the cheapest hedge for the next
  # tag push. If a future audit shows these are still unused, drop
  # them again.
  actions: write
  id-token: write
  # Build provenance: each bundle gets a Sigstore-signed attestation that it
  # was built by this workflow from the tagged commit. Users check it with
  # `gh attestation verify <file> --repo clavix-org/clavix`. id-token above is
  # what lets the job obtain the signing certificate.
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            tauri-target: ""
            artifact-name: linux
          - platform: macos-15
            tauri-target: "--target universal-apple-darwin"
            artifact-name: macos
          - platform: windows-latest
            tauri-target: ""
            artifact-name: windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-deps.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # `releaseBody` used to be a hardcoded string, so every release page said
      # "Automated release built by GitHub Actions" and nothing about what the
      # version contained — v0.17.0, v0.18.0 and v0.19.0 all shipped real
      # features behind that same blurb, and v0.19.1's notes had to be patched
      # by hand after publication.
      #
      # Note this is NOT the usual release-please arrangement: tauri-action
      # creates the release itself and writes its own body, so enriching the
      # release PR body changes nothing a user ever sees. The CHANGELOG is the
      # only text that reaches them, hence reading it here.
      #
      # Runs on all three matrix runners, so it must be deterministic: the body
      # is a pure function of the tag and the checked-out CHANGELOG, which are
      # identical everywhere, so whichever runner creates the release first
      # writes the same text the other two would have.
      - name: Compose the release notes from the CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${{ steps.tag.outputs.value }}"
          version="${version#v}"

          # Everything between this version's `## [x.y.z]` heading and the next
          # one, with the leading blank lines release-please emits dropped.
          section="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { if (!started && $0 ~ /^[[:space:]]*$/) next; started = 1; print }
          ' CHANGELOG.md)"

          # No entry is not an error: a workflow_dispatch re-run can name a tag
          # this checkout has no section for. Say less rather than lie.
          if [ -z "$section" ]; then
            echo "::warning::No CHANGELOG section for $version; publishing the artifact legend only."
            section="See the CHANGELOG for what this version contains."
          fi

          # Emitted line by line rather than from a heredoc on purpose: heredoc
          # bodies sit at column 0, which ends this YAML block scalar early —
          # and a bare `---` there parses as a document separator, silently
          # cutting every later step out of the workflow.
          {
            echo "body<<CLAVIX_RELEASE_NOTES_EOF"
            printf '%s\n' "$section"
            echo
            echo "---"
            echo
            echo "Automated release built by GitHub Actions."
            echo
            echo "Artifacts :"
            echo "- \`.AppImage\` : portable Linux binary, double-click to run"
            echo "- \`.deb\` : Debian / Ubuntu package (\`sudo dpkg -i\`)"
            echo "- \`.rpm\` : Fedora / openSUSE package"
            echo "- \`.dmg\` / \`.app.tar.gz\` : macOS (universal)"
            echo "- \`.msi\` / \`-setup.exe\` : Windows (x64)"
            echo "- \`-frontend.tar.gz\` : the built web UI, for distribution packagers"
            echo
            echo "Code signing policy: https://github.com/clavix-org/clavix/blob/master/CODE_SIGNING.md"
            echo "CLAVIX_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # macOS signing + notarization, so Gatekeeper opens the app without the
      # "unidentified developer" block. Tauri does the whole job when these
      # variables are present: it imports the certificate into a throwaway
      # keychain, signs the .app with the hardened runtime, notarizes it with
      # Apple, staples the ticket, then signs the DMG that wraps it.
      #
      # Exported here rather than set on the tauri-action step because an
      # unset secret becomes an empty string there, and Tauri treats an empty
      # APPLE_CERTIFICATE as "present" and fails importing it. Forks and
      # repositories without the secrets keep building unsigned bundles; a
      # half-filled set fails loudly instead of shipping something unsigned
      # by accident. MACOS_SIGNING.md explains how to create the secrets.
      - name: Configure macOS code signing
        id: macos-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          set_count=0
          for n in "${names[@]}"; do
            [ -n "${!n}" ] && set_count=$((set_count + 1))
          done

          if [ "$set_count" -eq 0 ]; then
            echo "::warning::No Apple signing secrets set; the macOS bundles will be unsigned."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$set_count" -ne "${#names[@]}" ]; then
            for n in "${names[@]}"; do
              [ -z "${!n}" ] && echo "::error::Secret $n is missing."
            done
            exit 1
          fi

          # Each GITHUB_ENV line is NAME=value, so a value with a newline in it
          # fails the step with nothing better than "Invalid format '***'".
          # The certificate is base64, where whitespace carries no data: drop
          # all of it, which accepts a `base64` output wrapped at 76 columns
          # (GNU's default). The other secrets only lose trailing newlines; one
          # with a newline inside is a mistake, and the error names it.
          APPLE_CERTIFICATE="$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]')"
          bad=0
          for n in "${names[@]}"; do
            v="${!n}"
            v="${v%"${v##*[!$'\r\n']}"}"
            if [[ "$v" == *$'\n'* || "$v" == *$'\r'* ]]; then
              echo "::error::Secret $n spans several lines. Set it again as a single line (see MACOS_SIGNING.md)."
              bad=1
            fi
            printf -v "$n" '%s' "$v"
          done
          [ "$bad" -eq 0 ] || exit 1

          for n in "${names[@]}"; do
            printf '%s=%s\n' "$n" "${!n}" >> "$GITHUB_ENV"
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Windows signing, so SmartScreen and UAC name a publisher instead of
      # warning about an unknown one. The certificate is a Certum Open Source
      # Code Signing certificate whose key stays in Certum's SimplySign cloud;
      # ssign (github.com/Le-Syl21/ssign, a third-party client, pinned by
      # checksum below) logs in there with the account e-mail and the TOTP
      # seed and has each file signed.
      #
      # Same rule as macOS: nothing set means unsigned bundles (forks), a
      # half-filled set fails loudly. WINDOWS_SIGNING.md explains the setup.
      # The seed is NOT exported to GITHUB_ENV: only the steps that sign
      # receive it.
      - name: Configure Windows code signing
        id: windows-signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          if [ -z "$CERTUM_EMAIL" ] && [ -z "$CERTUM_OTP" ]; then
            echo "::warning::No Certum signing secrets set; the Windows bundles will be unsigned."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for n in CERTUM_EMAIL CERTUM_OTP; do
            if [ -z "${!n}" ]; then
              echo "::error::Secret $n is missing (see WINDOWS_SIGNING.md)."
              exit 1
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # With Windows signing on, tauri-action must not run: it publishes the
      # bundles the moment they are built, and the MSI is still unsigned at
      # that point. The steps after it build, verify, then publish instead.
      - name: Build and bundle with tauri-action
        if: steps.windows-signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: "Clavix ${{ steps.tag.outputs.value }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri-target }}

      # A release binary rather than `cargo install`: no compile, and a
      # checksum that pins exactly what gets to see the signing credentials.
      # Bumping SSIGN_VERSION means updating the checksums here and in the
      # "Sign the Windows MSI" job.
      - name: Install ssign
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSIGN_VERSION: v0.1.11
          SSIGN_SHA256: 3dacba75082d2949bae332f6dfac342843a85838db75deba9721b40b43fe73f0
        run: |
          dir="$RUNNER_TEMP/ssign"
          mkdir -p "$dir"
          gh release download "$SSIGN_VERSION" --repo Le-Syl21/ssign \
            --pattern ssign-windows-x86_64.zip --dir "$dir"
          echo "$SSIGN_SHA256  $dir/ssign-windows-x86_64.zip" | sha256sum --check
          unzip -o "$dir/ssign-windows-x86_64.zip" -d "$dir"

      # Tauri runs the sign command on clavix.exe before packing it, on the
      # NSIS uninstaller, and on each finished installer, so the files that
      # end up on the user's disk are signed too, not only the download. The
      # script skips the MSI (see the "Sign the Windows MSI" job). ssign keeps
      # its Certum session for 20 minutes, so those calls share one login.
      - name: Build and sign the Windows bundles
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: bash
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          export SSIGN_EXE="$(cygpath -w "$RUNNER_TEMP/ssign/ssign.exe")"
          script="$(cygpath -m "$GITHUB_WORKSPACE/.github/scripts/sign-windows.ps1")"
          config="$(cygpath -m "$RUNNER_TEMP/tauri.signing.conf.json")"
          jq -n --arg script "$script" '{
            bundle: { windows: { signCommand: {
              cmd: "pwsh",
              args: ["-NoProfile", "-NonInteractive", "-File", $script, "%1"]
            } } }
          }' > "$config"
          pnpm tauri build --config "$config"

      # Checks what a user's Windows will check, so a sign command that
      # Tauri never called (or that signed with something untrusted) fails
      # the release job instead of reaching users as a SmartScreen warning.
      # The clavix.exe checked here is the one Tauri signed in place and
      # then packed into both installers.
      - name: Verify the Windows signatures
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'src-tauri/target/release'
          $files = @(Get-Item "$release/clavix.exe") + @(Get-ChildItem "$release/bundle/nsis/*-setup.exe")
          if ($files.Count -ne 2) {
            Write-Host "::error::Expected clavix.exe and one -setup.exe, found $($files.Count) file(s)."
            exit 1
          }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($f.Name) is not validly signed: $($sig.Status) $($sig.StatusMessage)"
              exit 1
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($f.Name) carries no timestamp: its signature would die with the certificate."
              exit 1
            }
            Write-Host "OK $($f.Name) -- $($sig.SignerCertificate.Subject)"
          }

      # What tauri-action does on the other runners, for the NSIS installer
      # only. The release normally exists by now, created by whichever of
      # them finished first; it is created here only when this runner wins.
      - name: Publish the signed NSIS installer
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Losing a race against another runner's tauri-action is fine:
            # the upload below then finds the release it created.
            gh release create "$TAG" --verify-tag --title "Clavix $TAG" --notes "$BODY" || true
          fi
          gh release upload "$TAG" --clobber src-tauri/target/release/bundle/nsis/*-setup.exe

      # The MSI holds the signed clavix.exe but is not signed itself yet.
      # It goes to the "Sign the Windows MSI" job as a workflow artifact, and
      # leaves the bundle directory so that the attestation below does not
      # vouch for a file that is never published in this form.
      - name: Hand the MSI over for signing
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: clavix-windows-msi-unsigned
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Remove the unsigned MSI from the bundle directory
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: bash
        run: rm src-tauri/target/release/bundle/msi/*.msi

      # Checks what a user's Mac will check, so a signing that silently fell
      # back to ad-hoc (or a notarization that was skipped) fails the release
      # job instead of reaching users as a Gatekeeper warning.
      - name: Verify macOS signature and notarization
        if: steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n1)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --verbose=2 "$dmg"

      # One list for every runner: each one matches only its own bundles, and
      # the action fails only when nothing at all matches, which would mean the
      # build produced no bundle. Paths mirror the fallback upload below, plus
      # the macOS updater archive that is published as a release asset.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

      # Only on failure, as the name says. tauri-action attaches every bundle
      # to the Release itself, and Release assets are free storage — artifacts
      # are not. Under `if: always()` this step re-uploaded the whole bundle
      # set on every successful tag too: ~155 MB per release against the 0.5 GB
      # Actions quota, for files already downloadable from the Release page.
      # Two overlapping tags were enough to reach 90% of the quota.
      - name: Upload artifacts (fallback if release step fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clavix-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
          # Short on purpose: this is a rescue copy to grab by hand right after
          # a failed publication, not an archive.
          retention-days: 7

  # ssign signs PE files only, so the MSI takes another road: osslsigncode
  # knows the MSI format, and ssign's PKCS#11 module lends it the same Certum
  # cloud key. That pair is documented on Linux, hence a job of its own rather
  # than more steps on the Windows runner. The steps are skipped when the
  # Certum secrets are not set (forks), where tauri-action has already
  # published an unsigned MSI.
  sign-msi:
    name: Sign the Windows MSI
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check for the Certum signing secrets
        id: signing
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          if [ -n "$CERTUM_EMAIL" ] && [ -n "$CERTUM_OTP" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Certum signing secrets set; nothing to sign."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the unsigned MSI
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: clavix-windows-msi-unsigned
          path: unsigned

      - name: Install osslsigncode
        if: steps.signing.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode libengine-pkcs11-openssl

      # Both pinned by checksum, like ssign.exe in the build job: the module
      # sees the signing credentials, and the intermediate certificate is what
      # links the signature to Certum's root.
      - name: Install the ssign PKCS#11 module and the Certum intermediate
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSIGN_VERSION: v0.1.11
          MODULE_SHA256: a42c341a2fa2d6c7c6c18609b524de845be22fedd5e8f52ee0158f11777253e7
          INTERMEDIATE_SHA256: 5ac82cbe9f28351e85d5262293bcfc8bacabead1294f248c1df17f81ce5ac3ce
        run: |
          mkdir -p "$RUNNER_TEMP/ssign"
          cd "$RUNNER_TEMP/ssign"
          gh release download "$SSIGN_VERSION" --repo Le-Syl21/ssign \
            --pattern ssign-pkcs11-linux-x86_64.tar.gz
          echo "$MODULE_SHA256  ssign-pkcs11-linux-x86_64.tar.gz" | sha256sum --check
          tar -xzf ssign-pkcs11-linux-x86_64.tar.gz

          # "Certum Code Signing 2021 CA", the issuer of the open source
          # certificates, as shipped in the ssign repository.
          gh api "repos/Le-Syl21/ssign/contents/ssign-core/src/certs/ccsca2021.der?ref=$SSIGN_VERSION" \
            --jq .content | base64 --decode > ccsca2021.der
          echo "$INTERMEDIATE_SHA256  ccsca2021.der" | sha256sum --check
          openssl x509 -inform DER -in ccsca2021.der -out certum-code-signing-2021-ca.pem

      - name: Sign the MSI
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          mkdir signed
          count=0
          for msi in unsigned/*.msi; do
            osslsigncode sign \
              -pkcs11module "$RUNNER_TEMP/ssign/libssign_pkcs11.so" \
              -pkcs11cert 'pkcs11:type=cert' -key 'pkcs11:type=private' \
              -ac "$RUNNER_TEMP/ssign/certum-code-signing-2021-ca.pem" \
              -h sha256 -ts http://time.certum.pl/ \
              -n "Clavix" -i "https://clavix.org" \
              -in "$msi" -out "signed/$(basename "$msi")"
            count=$((count + 1))
          done
          [ "$count" -eq 1 ] || { echo "::error::Expected one MSI, signed $count."; exit 1; }

      # Chain and timestamp against the system trust store, which carries
      # Certum's roots: a signature that only looks present fails here.
      - name: Verify the MSI signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          osslsigncode verify \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -TSA-CAfile /etc/ssl/certs/ca-certificates.crt \
            -in signed/*.msi

      - name: Attest build provenance
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: signed/*.msi

      - name: Attach the signed MSI to the release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" signed/*.msi --clobber

  # The built web UI as its own release asset, so distribution packages can
  # compile only the Rust side: the frontend build needs prebuilt rolldown and
  # lightningcss binaries and a wasm module that not every architecture's build
  # system can produce. The build is reproducible (vite.config.js pins
  # SvelteKit's version name) and so is the tarball, so a packager can rebuild
  # from the tag and compare checksums. Runs after `build` because tauri-action
  # is what creates the release; `!cancelled()` still attaches it when only
  # one platform failed and the release exists anyway.
  frontend:
    name: Frontend tarball
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Built twice and compared, so a change that brings back a per-build
      # value (a timestamp, a random id) fails here instead of in a packager's
      # rebuild.
      - name: Build the frontend twice and check the outputs match
        run: |
          pnpm run build
          mv build "$RUNNER_TEMP/first-build"
          pnpm run build
          diff -r "$RUNNER_TEMP/first-build" build

      # Sorted entries, fixed owner, modes and mtime (the tagged commit's), and
      # no name or timestamp in the gzip header: the same build/ always gives
      # the same checksum.
      - name: Pack the tarball
        id: pack
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          file="clavix-${TAG#v}-frontend.tar.gz"
          tar --sort=name --format=gnu \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            --mtime="@$(git log -1 --format=%ct)" \
            -cf - build | gzip -9 -n > "$file"
          sha256sum "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.file }}

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber

  # Posts a release notification to a Discord channel after every
  # platform-build job has succeeded. Silently no-ops when the secret
  # is unset (forks, manual dry-runs) so the workflow itself never
  # fails on the notification step.
  notify:
    name: Notify Discord
    # sign-msi too, so the announcement does not go out before the MSI is on
    # the release.
    needs: [build, sign-msi]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord webhook
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.value }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not set — skipping notification."
            exit 0
          fi

          # CHANGELOG sections are headed with `## [X.Y.Z]`. Strip the
          # leading "v" from the tag to match. Pull the lines between
          # this version's header and the next one, capped at 3800
          # characters (Discord embed description limit is 4096; we
          # leave headroom for jq escaping and the trailing "see full
          # changelog" line). Cutting at line boundaries keeps the
          # truncation UTF-8 safe — gawk's length() is char-aware
          # under a UTF-8 locale, which the runner provides.
          VERSION="${TAG#v}"
          HIGHLIGHTS=$(LC_ALL=C.UTF-8 awk -v ver="$VERSION" -v max=3800 '
            BEGIN { found = 0; total = 0 }
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found {
              extra = length($0) + 1
              if (total + extra > max) {
                print "…"
                print ""
                print "(see CHANGELOG.md for the full list)"
                exit
              }
              print
              total += extra
            }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$HIGHLIGHTS" | tr -d '[:space:]')" ]; then
            HIGHLIGHTS="(see CHANGELOG.md for the full list)"
          fi

          # 0x175DDC = 1531356, the Bitwarden brand blue, kept in sync
          # with the in-app accent so the notification visually matches
          # the client.
          # allowed_mentions: parse=[] so a stray @everyone or @here in
          # the changelog excerpt cannot ping the entire Discord server.
          # Keep this on the payload, not just on the embed: Discord
          # parses mentions from the embed description regardless.
          PAYLOAD=$(jq -n \
            --arg title "Clavix ${TAG} released" \
            --arg url "${REPO_URL}/releases/tag/${TAG}" \
            --arg desc "$HIGHLIGHTS" \
            '{
              allowed_mentions: { parse: [] },
              embeds: [{title: $title, url: $url, description: $desc, color: 1531356}]
            }')

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data-raw "$PAYLOAD" \
            "$WEBHOOK"
